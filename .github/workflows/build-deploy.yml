name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run copy lint
        run: python scripts/copy_lint.py
        # Fails with exit code 1 if any banned advice phrase is found in .html or .js files.
        # Edit scripts/banned_phrases.txt to maintain the phrase list.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Write game Supabase config
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "url": os.environ.get("SUPABASE_URL", ""),
              "anonKey": os.environ.get("SUPABASE_PUBLISHABLE_KEY", ""),
          }
          Path("country_outline_game/supabase_config.js").write_text(
              "window.MAP_MEADOW_SUPABASE = "
              + json.dumps(config, separators=(",", ":"))
              + ";\n",
              encoding="utf-8",
          )
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
